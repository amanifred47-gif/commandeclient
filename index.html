<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pad=n=>String(n).padStart(2,'0');
const fmtNb=n=>(n==null||!isFinite(n))?'':(n<0?'-':'')+String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const fmtT=n=>{if(n==null||!isFinite(n))return '';const r=Math.round(n*100)/100;const p=String(Math.abs(r)).split('.');return (r<0?'-':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(p[1]?','+p[1]:'');};
const F=n=>fmtNb(n)+' F';
const fmtDay=ts=>{const d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();};
const fmtH=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtD=ts=>fmtDay(ts)+' '+fmtH(ts);
const isoDay=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};

  const carre=(src,w,h,taille)=>{const c=document.createElement('canvas');c.width=taille;c.height=taille;
   const m=Math.min(w,h),x=(w-m)/2,y=(h-m)/2;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,taille,taille);

  try{const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});

  const r=new FileReader();
  r.onerror=()=>{toast('Impossible de lire cette image.');fini(false);};
  r.onload=()=>{const img=new Image();
   img.onerror=()=>{toast('Ce fichier n’est pas une image lisible.');fini(false);};
   img.onload=()=>poser(carre(img,img.width,img.height,256));
   img.src=r.result;};
  r.readAsDataURL(f);};

}

const SNAP=o=>({client:o.client,marque:o.marque,inc:o.inc,lieu:o.lieu,livraison:o.livraison,note:o.note,transPU:o.transPU?fmtNb(o.transPU)+' F/t':'',

function diffSnap(a,b){const out=[];for(const k of Object.keys(a))if(String(a[k]??'')!==String(b[k]??''))out.push({champ:CHLAB[k]||k,avant:a[k],apres:b[k]});return out;}
function editOrder(id){
 const o=byId(id);if(!o)return;
 if(o.annule){toast('Rétablissez d’abord la commande pour la modifier.');return;}
 S.draft=JSON.parse(JSON.stringify(o));S.draft.__edit=id;S.draft.__snap=SNAP(o);closeDrawer();go('new');

function applyEdit(d){
 const o=byId(d.__edit);if(!o)return null;
 const before=d.__snap,motif=(prompt('Motif de la modification (visible par tous) :','Correction demandée par le client')||'').trim();
 ['client','marque','inc','lieu','livraison','note','transPU','lignes','camions'].forEach(k=>{o[k]=d[k];});
 const after=SNAP(o);const ch=diffSnap(before,after);
 ch.forEach(c=>hist(o,c.champ,c.avant,c.apres,motif));
 if(ch.length){alerte(o,'Commande modifiée : '+ch.map(c=>c.champ.toLowerCase()).join(', ')+(motif?' — '+motif:''));addLog(o,'Commande modifiée par '+S.user.name+(motif?' — '+motif:'')+' : '+ch.map(c=>c.champ.toLowerCase()).join(', '));

/* ================= Période commune ================= */
function per(){const p=S.per||(S.per={mode:'tout',from:'',to:''});
 const O=orders();const lo=O.length?Math.min(...O.map(o=>o.ts)):Date.now(),hi=Date.now();
 const d0=new Date();d0.setHours(0,0,0,0);
 if(p.mode==='jour')return {a:d0.getTime(),b:hi,lab:"Aujourd’hui"};
 if(p.mode==='hier'){const h=d0.getTime()-864e5;return {a:h,b:d0.getTime()-1,lab:'Hier'};}
 if(p.mode==='7j')return {a:d0.getTime()-6*864e5,b:hi,lab:'7 derniers jours'};
 if(p.mode==='mois'){const m=new Date(d0.getFullYear(),d0.getMonth(),1);return {a:m.getTime(),b:hi,lab:'Mois en cours'};}
 if(p.mode==='libre'&&(p.from||p.to)){const a=p.from?new Date(p.from+'T00:00:00').getTime():lo,b=p.to?new Date(p.to+'T23:59:59').getTime():hi;return {a,b,lab:(p.from?fmtDay(a):'début')+' au '+(p.to?fmtDay(b):"aujourd’hui")};}
 return {a:lo-1,b:hi,lab:'Toute la période'};
}
function barPeriode(){const p=S.per||{mode:'tout'};const M=[['jour',"Aujourd’hui"],['hier','Hier'],['7j','7 jours'],['mois','Mois'],['tout','Tout'],['libre','Dates']];
 return `<div class="chips" style="margin-bottom:8px">${M.map(([k,l])=>`<button class="chip${p.mode===k?' on':''}" data-per="${k}">${l}</button>`).join('')}

function alerte(o,txt,par){const a={id:uid('A'),oid:o?o.id:'',pf:o?o.pf:'',ts:Date.now(),txt,by:par||S.user.name};
 (S.data.alertes=S.data.alertes||[]).push(a);return a;}
const vuKey=a=>S.user.name+'|'+a.id;
const estVue=a=>a.by===S.user.name||(S.data.vu||{})[vuKey(a)];
function concerne(a){const o=a.oid&&byId(a.oid);if(!o)return (S.user.role==='direction'||S.user.role==='admin');
 const p=pfById(o.pf);const r=S.user.role;
 if(r==='direction')return true;
 if(r==='commercial')return o.by===S.user.name;
 if(r==='adv')return !p||!p.adv||p.adv===S.user.name;
 if(r==='tresorerie')return /paiement|justificatif|montant|avoir|retenue|annul/i.test(a.txt);
 return false;}
const alertesOuvertes=()=>(S.data.alertes||[]).filter(a=>!estVue(a)&&concerne(a));
const alertesDe=o=>alertesOuvertes().filter(a=>a.oid===o.id);
function vuAlerte(id){S.data.vu=S.data.vu||{};const a=(S.data.alertes||[]).find(x=>x.id===id);if(a)S.data.vu[vuKey(a)]=Date.now();save();}
function vuToutes(o){alertesDe(o).forEach(a=>{S.data.vu=S.data.vu||{};S.data.vu[vuKey(a)]=Date.now();});save();}
function blocAlertes(o){const A=alertesDe(o);if(!A.length)return '';
 return `<div class="alert warn" style="align-items:center"><span class="led o k" style="margin-top:3px"></span><div style="flex:1"><b>${A.length} changement(s) à prendre en compte</b>
 ${A.map(a=>`<div style="font-size:12.5px;margin-top:3px">• ${esc(a.txt)} <span class="m">— ${esc(a.by)}, ${fmtD(a.ts)}</span></div>`).join('')}</div>

/* ================= Réception : tout ce qui arrive ================= */
function fluxRecu(){
 const out=[];
 for(const o of orders()){
  if(!mine(o))continue;if(!diffusee(o)&&!voitAvantDiffusion(o))continue;const p=pfById(o.pf);const t=totals(o);
  out.push({ts:o.ts,k:'cmd',by:o.by,oid:o.id,pf:o.pf,
   titre:'Nouvelle commande · '+o.client,
   txt:fmtT(t.T)+' t '+o.lignes.map(l=>l.prod).join(' + ')+' · '+o.inc+' '+o.lieu+' · '+fmtNb(t.total)+' F',
   pour:['adv','tresorerie','direction']});
  for(const q of (o.po||[])){const pl=partDe(o,q);
   out.push({ts:q.ts,k:'po',by:q.by,oid:o.id,pf:o.pf,titre:'PO attribué · '+q.n,
    txt:o.client+(pl&&nbPo(o)>1?' — '+pl.lab:'')+' · '+fmtT(pl?pl.qty:t.T)+' t',pour:['commercial','tresorerie','direction']});}
  for(const q of (o.paiements||[])){
   const st=q.statut||'valide';
   out.push({ts:q.ts||o.ts,k:'pay',by:q.by,oid:o.id,pf:o.pf,
    titre:(st==='attente'?'Justificatif déposé · ':st==='valide'?'Paiement validé · ':st==='rejete'?'Justificatif rejeté · ':'Paiement pas encore passé · ')+fmtNb(q.amt)+' F',
    txt:o.client+' · '+(q.mode||'')+(q.ref?' · '+q.ref:'')+(q.motif?' — '+q.motif:''),photo:q.photo||'',
    pour:st==='attente'?['tresorerie','direction']:['commercial','adv','direction']});}
  for(const m of (o.fil||[])){if(m.kind==='sys')continue;
   out.push({ts:m.ts,k:'msgcmd',by:m.by,oid:o.id,pf:o.pf,titre:'Message sur '+o.ref+' · '+o.client,txt:m.txt,pour:['commercial','adv','tresorerie','direction']});}
  if(o.annule)out.push({ts:o.annuleTs||o.ts,k:'ann',by:o.annuleBy||'',oid:o.id,pf:o.pf,titre:'Commande annulée · '+o.client,txt:o.annuleMotif||'',pour:['commercial','adv','tresorerie','direction']});
 }
 for(const m of (S.data.chat||[])){const p=pfById(m.pf);
  if(m.pf==='general'){out.push({ts:m.ts,k:'msg',by:m.by,pf:'general',titre:'Message à tous',txt:m.txt,photo:m.photo||'',pour:['commercial','adv','tresorerie','direction','approbateur','admin']});continue;}
  if(!p)continue;
  if(!pfVisibles().some(x=>x.id===m.pf)&&!voirTout())continue;
  out.push({ts:m.ts,k:'msg',by:m.by,pf:m.pf,titre:'Message · '+(p?p.nom:''),txt:m.txt,photo:m.photo||'',pour:['commercial','adv','tresorerie','direction']});}
 for(const a of (S.data.alertes||[])){const o=a.oid&&byId(a.oid);if(o&&!mine(o))continue;
  out.push({ts:a.ts,k:'alerte',by:a.by,oid:a.oid,pf:a.pf,titre:'Changement · '+(o?o.client:''),txt:a.txt,pour:['commercial','adv','tresorerie','direction']});}
 return out.filter(x=>x.by!==S.user.name&&x.pour.includes(S.user.role)).sort((a,b)=>b.ts-a.ts);
}

 $$('[data-rk]').forEach(b=>b.onclick=()=>{S.f.recu.k=b.dataset.rk;render();});
 let tm;$('#rq').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.f.recu.q=e.target.value;render();},250);};

}

/* ================= Direct entre onglets et notifications ================= */
const BUS=(()=>{try{return new BroadcastChannel('pcc');}catch(e){return null;}})();
let _dernier=0;
function pousser(){try{if(BUS)BUS.postMessage({t:Date.now(),by:S.user?S.user.name:'',e:espaceId()});}catch(e){}}
function recharger(){const d=store.get('data',null);if(!d)return;S.data=d;
 const F=S.user?fluxRecu():[];const neuf=F.filter(x=>x.ts>_dernier&&x.ts>luInbox());
 if(neuf.length){const x=neuf[0];notifier(x);}
 _dernier=Math.max(_dernier,...F.map(x=>x.ts),0);
 render();}
function notifier(x){
 toast('🔔 '+x.titre+' — '+(x.txt||'').slice(0,60));
 try{if(window.Notification&&Notification.permission==='granted')new Notification(x.titre,{body:(x.by?x.by+' · ':'')+(x.txt||'').slice(0,120)});}catch(e){}
 try{const A=new (window.AudioContext||window.webkitAudioContext)();const o=A.createOscillator(),g=A.createGain();
  o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(A.destination);o.start();setTimeout(()=>{o.stop();A.close();},160);}catch(e){}
}
function initDirect(){
 if(BUS)BUS.onmessage=e=>{if(!S.user)return;if(!e.data)return;if(e.data.typing){recuFrappe(e.data);return;}if(e.data.e!==espaceId())return;if(e.data.by===S.user.name)return;recharger();};
 window.addEventListener('storage',e=>{if(e.key===PFX+'data'&&S.user)recharger();});
 const F=S.user?fluxRecu():[];_dernier=Math.max(0,...F.map(x=>x.ts));
}

/* ================= Récapitulatif par période ================= */
function vRecap(){
 const f=S.f.recap||(S.f.recap={pas:'mois',pf:''});
 let O=visible().filter(o=>!o.annule);
 if(f.pf)O=O.filter(o=>o.pf===f.pf);
 const cle=ts=>{const d=new Date(ts);
  if(f.pas==='jour')return isoDay(ts);
  if(f.pas==='semaine'){const x=new Date(d);x.setDate(d.getDate()-((d.getDay()+6)%7));return isoDay(x.getTime());}
  if(f.pas==='annee')return String(d.getFullYear());
  return d.getFullYear()+'-'+pad(d.getMonth()+1);};
 const lib=k=>f.pas==='jour'?k.split('-').reverse().join('/'):f.pas==='semaine'?'Semaine du '+k.split('-').reverse().join('/'):f.pas==='annee'?k:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'][+k.slice(5)-1]+' '+k.slice(0,4);
 const M=new Map();
 O.forEach(o=>{const t=totals(o);const k=cle(o.ts);const r=M.get(k)||{k,n:0,T:0,total:0,net:0,paid:0,att:0,reste:0,po:0,cl:new Set()};
  r.n++;r.T+=t.T;r.total+=t.total;r.net+=t.net;r.paid+=t.paid;r.att+=t.attente;if(t.reste>100)r.reste+=t.reste;r.po+=(o.po||[]).length;r.cl.add(CKEY(o.client));M.set(k,r);});
 const L=[...M.values()].sort((a,b)=>b.k.localeCompare(a.k));
 const G={n:sum(L,x=>x.n),T:sum(L,x=>x.T),total:sum(L,x=>x.total),net:sum(L,x=>x.net),paid:sum(L,x=>x.paid),att:sum(L,x=>x.att),reste:sum(L,x=>x.reste),po:sum(L,x=>x.po)};
 const mx=Math.max(1,...L.map(x=>x.total));
 $('#view').innerHTML=`<div class="band"><h2>Récapitulatif des commandes</h2><span>Depuis le début · ${G.n} commande(s)</span></div>
 <div class="chips" style="margin-bottom:10px">${[['jour','Par jour'],['semaine','Par semaine'],['mois','Par mois'],['annee','Par année']].map(([k,l])=>`<button class="chip${f.pas===k?' on':''}" data-pas="${k}">${l}</button>`).join('')}
 ${pfVisibles().length>1?`<select class="field" id="rcPf" style="height:32px;width:auto"><option value="">Tous les portefeuilles</option>${pfVisibles().map(p=>`<option value="${esc(p.id)}"${f.pf===p.id?' selected':''}>${esc(p.nom)}</option>`).join('')}</select>`:''}</div>
 <div class="kpis" style="margin-bottom:10px">
  <div class="kpi" style="--c:#0E9F8E"><div class="l">Commandes depuis le début</div><div class="v">${fmtNb(G.n)}</div><div class="d">${fmtT(G.T)} t</div></div>
  <div class="kpi" style="--c:#2C8FD6"><div class="l">Montant total</div><div class="v">${fmtNb(G.total)}</div><div class="d">net ${fmtNb(G.net)} après déductions</div></div>
  <div class="kpi" style="--c:#1E9E57"><div class="l">Encaissé</div><div class="v">${fmtNb(G.paid)}</div><div class="d">${G.net?Math.round(G.paid/G.net*100):0} % du net${G.att?' · '+fmtNb(G.att)+' en vérification':''}</div></div>
  <div class="kpi" style="--c:#E0533B"><div class="l">Reste à payer</div><div class="v">${fmtNb(G.reste)}</div><div class="d">${fmtNb(G.po)} PO attribués</div></div>
 </div>
 <div class="tblwrap"><table class="tbl"><thead><tr><th>Période</th><th class="num">Commandes</th><th class="num">Clients</th><th class="num">Tonnage</th><th class="num">Montant</th><th class="num">Net</th><th class="num">Encaissé</th><th class="num">Reste</th><th>Poids</th></tr></thead><tbody>
 ${L.map(r=>`<tr class="click" data-perk="${esc(r.k)}"><td><b>${esc(lib(r.k))}</b></td><td class="num">${r.n}</td><td class="num">${r.cl.size}</td><td class="num">${fmtT(r.T)} t</td><td class="num">${fmtNb(r.total)}</td><td class="num">${fmtNb(r.net)}</td><td class="num">${fmtNb(r.paid)}</td><td class="num" style="color:${r.reste>100?'#B93A24':'#157A42'}">${fmtNb(r.reste)}</td><td style="width:110px"><div style="height:8px;border-radius:4px;background:#0E9F8E;width:${Math.round(r.total/mx*100)}%"></div></td></tr>`).join('')||'<tr><td colspan="9">Aucune commande.</td></tr>'}
 <tr style="font-weight:700;background:#F3F8F8"><td>Total général</td><td class="num">${G.n}</td><td class="num"></td><td class="num">${fmtT(G.T)} t</td><td class="num">${fmtNb(G.total)}</td><td class="num">${fmtNb(G.net)}</td><td class="num">${fmtNb(G.paid)}</td><td class="num">${fmtNb(G.reste)}</td><td></td></tr></tbody></table></div>
 <div class="legend" style="margin-top:8px"><span>Cliquez une période pour voir ses commandes.</span></div>`;
 $$('[data-pas]').forEach(b=>b.onclick=()=>{S.f.recap.pas=b.dataset.pas;render();});
 if($('#rcPf'))$('#rcPf').onchange=e=>{S.f.recap.pf=e.target.value;render();};
 $$('[data-perk]').forEach(t=>t.onclick=()=>{const k=t.dataset.perk;let a,b2;
  if(f.pas==='jour'){a=k;b2=k;}else if(f.pas==='semaine'){const d=new Date(k+'T00:00:00');a=k;const e=new Date(d);e.setDate(d.getDate()+6);b2=isoDay(e.getTime());}
  else if(f.pas==='annee'){a=k+'-01-01';b2=k+'-12-31';}else{const y=+k.slice(0,4),m=+k.slice(5);a=k+'-01';b2=isoDay(new Date(y,m,0).getTime());}
  S.per={mode:'libre',from:a,to:b2};S.f.cmd.st='all';if(f.pf)S.f.cmd.pf=f.pf;go('cmd');});
}

function lireInvite(txt){
 const s=String(txt||'').trim().replace(/\s+/g,'');

  '1. Ouvrez l’application.','2. Choisissez « J’ai reçu un accès ».','3. Collez le code ci-dessous.','4. Choisissez votre code personnel.','',
  inviteCode(u),'','Votre code provisoire est '+u.code+' : il vous sera demandé de le changer à la première connexion.'].join('\n');

function rejoindre(inv,codeSaisi){
 if(!inv)return 'Code d’accès non reconnu.';
 if(String(inv.c)!==String(codeSaisi))return 'Code provisoire incorrect.';
 if(inv.e){ouvrirEspace(inv.e);REG.add(inv.e,inv.s||inv.e);load();}
 if(!S.data.soc)S.data.soc={nom:inv.s||'',ncc:'',rccm:'',tel:'',adresse:'',tva:18,devise:'F'};
 S.data.users=S.data.users||[];

 if(!u){u={id:uid('U'),name:inv.n,role:inv.r,code:inv.c,actif:1,cree:Date.now(),par:'invitation',neuf:1};users().push(u);}
 else {u.role=inv.r;u.code=inv.c;u.actif=1;u.neuf=1;}

 return '';
}

/* ================= Avatar : photo ou dessin ================= */
const AVBG=[['#0E9F8E','#0F3D3E'],['#4C5FD5','#22307F'],['#E89A12','#9C6206'],['#9448BC','#5B2477'],['#2C8FD6','#12507F'],['#1E9E57','#0C5A31'],['#E0533B','#8E2A18'],['#0F3D3E','#000']];
const AVEMO=['','🧢','👷','🚛','🧾','💰','⭐','🙂','🏗️','📦'];
function dessinAvatar(txt,i,emo,forme){
 const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
 const [a,b]=AVBG[i%AVBG.length];const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,a);g.addColorStop(1,b);
 x.fillStyle=g;
 if(forme==='rond'){x.beginPath();x.arc(128,128,128,0,7);x.fill();}else x.fillRect(0,0,256,256);
 x.globalAlpha=.14;x.fillStyle='#fff';x.beginPath();x.arc(60,54,86,0,7);x.fill();x.globalAlpha=1;
 x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';

/* ================= Fil général : tout le monde voit tout ================= */
const FICO={cmd:['🧾','#0E9F8E','Commande'],po:['#','#4C5FD5','PO'],pay:['💰','#1E9E57','Paiement'],
 msg:['💬','#9448BC','Message'],appro:['✓','#E89A12','Approbation'],sig:['⚠','#E0533B','Signalement'],
 ann:['✕','#E0533B','Annulation'],mod:['✎','#2C8FD6','Modification']};
function fluxGeneral(){
 const out=[];
 for(const o of orders()){
  if(!diffusee(o)&&!voitAvantDiffusion(o))continue;
  const p=pfById(o.pf),t=totals(o);
  out.push({ts:o.ts,k:'cmd',by:o.by,pf:o.pf,oid:o.id,
   titre:o.client,txt:fmtT(t.T)+' t '+o.lignes.map(l=>l.prod).join(' + ')+' · '+o.inc+' '+o.lieu+' · '+fmtNb(t.total)+' F',ref:o.ref});
  for(const q of (o.po||[])){const pl=partDe(o,q);
   out.push({ts:q.ts,k:'po',by:q.by,pf:o.pf,oid:o.id,titre:q.n+(q.pour?' (pour '+q.pour+')':''),
    txt:o.client+(pl&&nbPo(o)>1?' · '+pl.lab:'')+' · '+fmtT(pl?pl.qty:t.T)+' t',ref:o.ref});}
  for(const q of (o.paiements||[])){const st=q.statut||'valide';
   out.push({ts:q.ts||o.ts,k:'pay',by:st==='valide'&&q.verifBy?q.verifBy:q.by,pf:o.pf,oid:o.id,
    titre:(st==='attente'?'Justificatif déposé':st==='valide'?'Paiement validé':st==='rejete'?'Justificatif rejeté':'Paiement pas encore passé')+' · '+fmtNb(q.amt)+' F',
    txt:o.client+' · '+(q.mode||'')+(q.ref?' · '+q.ref:'')+(q.motif?' — '+q.motif:'')+(q.odoo?' · Odoo '+q.odoo:''),photo:q.photo||'',ref:o.ref});}
  if(o.appro&&o.appro.etat!=='attente')out.push({ts:o.appro.ts||o.ts,k:'appro',by:o.appro.par||'',pf:o.pf,oid:o.id,
   titre:o.appro.etat==='ok'?'Accord donné':'Accord refusé',txt:o.client+(o.appro.motif?' — '+o.appro.motif:''),ref:o.ref});
  for(const s of (o.signal||[])){out.push({ts:s.ts,k:'sig',by:s.par,pf:o.pf,oid:o.id,titre:'Erreur signalée · '+s.type,txt:o.client+(s.txt?' — '+s.txt:'')+(s.clos?' · corrigé par '+s.closPar:''),ref:o.ref});}
  for(const m of (o.fil||[])){if(m.kind==='sys')continue;
   out.push({ts:m.ts,k:'msg',by:m.by,pf:o.pf,oid:o.id,titre:'Message sur '+o.ref,txt:m.txt,ref:o.ref});}
  if(o.annule)out.push({ts:o.annuleTs||o.ts,k:'ann',by:o.annuleBy||'',pf:o.pf,oid:o.id,titre:'Commande annulée',txt:o.client+(o.annuleMotif?' — '+o.annuleMotif:''),ref:o.ref});
 }
 for(const m of (S.data.chat||[])){const p=pfById(m.pf);
  out.push({ts:m.ts,k:'msg',by:m.by,pf:m.pf,titre:m.pf==='general'?'Message à tous':'Message · '+(p?p.nom:''),txt:m.txt,photo:m.photo||''});}
 for(const h of (S.data.hist||[])){if(!h.oid)continue;if(!/produit|tonnage|lieu|client|total|transport|camion/i.test(h.champ||''))continue;
  out.push({ts:h.ts,k:'mod',by:h.by,pf:(byId(h.oid)||{}).pf||'',oid:h.oid,titre:'Modification · '+h.champ,txt:(h.avant||'—')+' → '+(h.apres||'—')+(h.motif?' ('+h.motif+')':''),ref:h.ref});}
 return out.sort((a,b)=>b.ts-a.ts);
}
function vFil(){

 let L=fluxGeneral().filter(x=>x.ts>=P.a&&x.ts<=P.b);

 const cnt=k=>fluxGeneral().filter(x=>x.ts>=P.a&&x.ts<=P.b&&(!k||x.k===k)&&(!f.pf||x.pf===f.pf)).length;

/* ================= Pièces jointes : compression automatique ================= */
const PJ={maxPx:1280,cible:110*1024,miniPx:420,miniCible:26*1024};
const koa=n=>n<1024?n+' o':n<1048576?Math.round(n/1024)+' Ko':(n/1048576).toFixed(1)+' Mo';
const poidsDataURL=d=>Math.round((String(d||'').length-22)*0.75);
async function bitmapDe(f){try{return await createImageBitmap(f,{imageOrientation:'from-image'});}catch(e){}
 return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=r.result;};r.onerror=rej;r.readAsDataURL(f);});}
function surCanvas(src,w,h,maxPx){
 const r=Math.min(1,maxPx/Math.max(w,h));const c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));
 const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);return c;}
function meilleurType(){const c=document.createElement('canvas');c.width=c.height=1;
 try{if(c.toDataURL('image/webp').indexOf('image/webp')===5)return 'image/webp';}catch(e){}return 'image/jpeg';}
function compresserCanvas(c,cible){
 const type=meilleurType();let q=0.82,d=c.toDataURL(type,q);
 while(poidsDataURL(d)>cible&&q>0.36){q-=0.1;d=c.toDataURL(type,q);}
 if(poidsDataURL(d)>cible){const p=surCanvas(c,c.width,c.height,Math.round(Math.max(c.width,c.height)*0.72));
  q=0.7;d=p.toDataURL(type,q);while(poidsDataURL(d)>cible&&q>0.36){q-=0.1;d=p.toDataURL(type,q);}}
 return d;}
async function compresserImage(f,opts){const o=Object.assign({},PJ,opts||{});
 const b=await bitmapDe(f);const c=surCanvas(b,b.width||b.naturalWidth,b.height||b.naturalHeight,o.maxPx);
 const grand=compresserCanvas(c,o.cible);
 const mini=compresserCanvas(surCanvas(c,c.width,c.height,o.miniPx),o.miniCible);
 if(b.close)b.close();
 return {img:grand,mini,src:f.name||'photo',type:'image',avant:f.size||0,apres:poidsDataURL(grand)};}
/* PDF : on récupère l’image de la page quand elle existe, sinon on garde le fichier s’il est léger */
async function imageDansPdf(buf){
 const u=new Uint8Array(buf);const s=new TextDecoder('latin1').decode(u);
 let best=null,i=0;
 while((i=s.indexOf('\xFF\xD8\xFF',i))>=0){const j=s.indexOf('\xFF\xD9',i+3);
  if(j<0)break;const len=j+2-i;if(len>2000&&(!best||len>best.len))best={i,len};i=j+2;}
 if(!best)return null;
 return new Blob([u.slice(best.i,best.i+best.len)],{type:'image/jpeg'});
}
async function preparerPiece(f){
 const nom=f.name||'pièce';
 if(/^image\//i.test(f.type)||/\.(jpe?g|png|webp|gif|bmp)$/i.test(nom))return await compresserImage(f);
 if(/pdf/i.test(f.type)||/\.pdf$/i.test(nom)){
  const buf=await f.arrayBuffer();
  try{const b=await imageDansPdf(buf);
   if(b){const r=await compresserImage(new File([b],nom.replace(/\.pdf$/i,'.jpg'),{type:'image/jpeg'}));
    r.src=nom;r.type='pdf-image';r.avant=f.size;return r;}}catch(e){}
  if(f.size<=260*1024){const d=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});
   return {img:'',mini:'',pdf:d,src:nom,type:'pdf',avant:f.size,apres:f.size};}
  return {erreur:'Ce PDF pèse '+koa(f.size)+' et ne contient pas d’image lisible. Envoyez une photo de la page, elle sera compressée automatiquement.'};
 }
 return {erreur:'Format non reconnu : envoyez une photo ou un PDF.'};
}
function choisirPiece(apres){
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*,application/pdf';inp.style.display='none';document.body.appendChild(inp);
 inp.onchange=async e=>{const f=e.target.files&&e.target.files[0];inp.remove();if(!f)return;
  toast('Compression en cours…');
  try{const p=await preparerPiece(f);
   if(p.erreur){toast(p.erreur);return;}
   if(p.avant&&p.apres)toast('Pièce ajoutée : '+koa(p.avant)+' réduits à '+koa(p.apres)+'.');
   apres(p);}catch(err){toast('Impossible de lire ce fichier.');}};
 inp.click();
}

function occupation(){

 try{for(const k of Object.keys(localStorage)){if(k.indexOf('pcc')!==0)continue;tot+=(localStorage.getItem(k)||'').length;}}catch(e){}
 for(const o of orders())for(const p of (o.paiements||[])){if(p.photo){n++;pj+=p.photo.length;}if(p.mini)pj+=p.mini.length;}
 for(const m of (S.data.chat||[]))if(m.photo){n++;pj+=m.photo.length;}
 const oct=Math.round(tot*0.75),pjo=Math.round(pj*0.75);
 const moy=n?Math.round(pjo/n):0;
 const cmd=orders().length||1;const parCmd=Math.round(oct/cmd);
 const restant=Math.max(0,4.6*1024*1024-oct);
 const parMois=parCmd*Math.max(1,Math.round(cmd/Math.max(1,moisEcoules())));
 return {oct,pjo,n,moy,parCmd,restant,mois:parMois?Math.floor(restant/parMois):999};
}
function moisEcoules(){const O=orders();if(!O.length)return 1;const a=Math.min(...O.map(o=>o.ts));return Math.max(1,Math.round((Date.now()-a)/2.6e9));}
function allegerAnciennes(mois){
 const lim=Date.now()-mois*2.6e9;let n=0,g=0;
 for(const o of orders()){if(o.ts>lim)continue;const t=totals(o);if(t.reste>100)continue;
  for(const p of (o.paiements||[])){if(p.photo&&p.mini){g+=p.photo.length-p.mini.length;p.photo=p.mini;n++;}}}
 for(const m of (S.data.chat||[]))if(m.ts<=lim&&m.photo&&m.mini){g+=m.photo.length-m.mini.length;m.photo=m.mini;n++;}
 save();return {n,g:Math.round(g*0.75)};
}

 const base='https://www.gstatic.com/firebasejs/10.12.2/';
 await chargerScript(base+'firebase-app-compat.js');
 await chargerScript(base+'firebase-firestore-compat.js');
 if(!window.firebase)throw new Error('SDK Firebase indisponible');
 return window.firebase;
}
function fbMsg(m){
 m=String(m||'');
 if(/permission|insufficient|PERMISSION_DENIED/i.test(m))return 'Vos règles Firestore refusent l’accès. Dans la console Firebase → Firestore → Règles, remplacez « allow read, write: if false » par la règle indiquée ci-dessous, puis publiez.';
 if(/téléchargement|indisponible|Failed to fetch|NetworkError|network/i.test(m))return 'Impossible de joindre Firebase : vérifiez la connexion Internet.';
 if(/not-found|NOT_FOUND|database/i.test(m))return 'Base Firestore introuvable : créez-la dans la console Firebase (Firestore Database → Créer une base de données).';
 return m;}
function fbEtat(e,err){FB.etat=e;FB.err=err||'';const el=$('#fbDot');if(el)el.className='fbdot '+e;render();}
async function fbConnecter(cfg){
 try{
  fbEtat('connexion');
  const fb=await fbCharger();
  FB.app=fb.apps&&fb.apps.length?fb.app():fb.initializeApp(cfg);
  FB.db=fb.firestore();
  try{await FB.db.enablePersistence({synchronizeTabs:true});}catch(e){}
  FB.sdk=fb;FB.cfg=cfg;fbSet(cfg);
  await fbEcouter();
  await fbPousser();
  fbEtat('ok');toast('Connecté au projet '+(cfg.projectId||'')+' : les données se synchronisent.');
 }catch(e){const m=String(e&&e.message||e);
  fbEtat('err',fbMsg(m));
  toast('Connexion impossible : '+FB.err);}
}
function fbCouper(){
 FB.stop.forEach(f=>{try{f();}catch(e){}});FB.stop=[];FB.db=null;FB.etat='off';render();
}
const fbRacine=()=>'societes/'+(espaceId()||'defaut');
async function fbEcouter(){
 const R=fbRacine();
 FB.stop.forEach(f=>{try{f();}catch(e){}});FB.stop=[];
 const col=(nom,appliquer)=>{
  const q=FB.db.collection(R+'/'+nom);
  FB.stop.push(q.onSnapshot(s=>{let n=0;
   s.docChanges().forEach(ch=>{if(ch.type==='removed')return;const d=ch.doc.data();if(!d)return;
    if(S.user&&d.par===S.user.name&&Date.now()-(d.maj||0)<1500)return;
    appliquer(ch.doc.id,d);n++;});
   if(n){FB.recu+=n;FB.dernier=Date.now();store.set('data',S.data);render();}
  },e=>fbEtat('err',fbMsg(e&&(e.message||e.code)||e))));
 };
 col('commandes',(id,d)=>{if(!d.json)return;const o=JSON.parse(d.json);const i=orders().findIndex(x=>x.id===o.id);
  if(i<0)orders().push(o);else if((d.maj||0)>=(orders()[i].__maj||0))orders()[i]=Object.assign(o,{__maj:d.maj});});
 col('messages',(id,d)=>{if(!d.json)return;const m=JSON.parse(d.json);if(!(S.data.chat||[]).some(x=>x.id===m.id))S.data.chat.push(m);});
 col('config',(id,d)=>{if(!d.json||id!=='general')return;const c=JSON.parse(d.json);
  S.data.users=c.users||S.data.users;S.data.pfs=c.pfs||S.data.pfs;S.data.clients=c.clients||S.data.clients;
  S.data.cfg=c.cfg||S.data.cfg;S.data.prix=c.prix||S.data.prix;S.data.transport=c.transport||S.data.transport;S.data.soc=c.soc||S.data.soc;});
}
async function fbPousser(quoi){
 if(FB.etat!=='ok'&&FB.etat!=='connexion')return;
 if(!FB.db)return;
 const R=fbRacine();const par=S.user?S.user.name:'';
 try{
  if(!quoi||quoi.cmd){for(const o of orders()){if(o.__envoye&&o.__envoye===o.__maj)continue;
   const maj=Date.now();o.__maj=maj;o.__envoye=maj;
   await FB.db.doc(R+'/commandes/'+o.id).set({json:JSON.stringify(o),maj,par,ref:o.ref||'',client:o.client||''});FB.envoi++;}}
  if(!quoi||quoi.msg){for(const m of (S.data.chat||[])){if(m.__envoye)continue;m.__envoye=1;
   await FB.db.doc(R+'/messages/'+m.id).set({json:JSON.stringify(m),maj:Date.now(),par});FB.envoi++;}}
  if(!quoi||quoi.cfg){const c={users:S.data.users,pfs:S.data.pfs,clients:S.data.clients,cfg:S.data.cfg,prix:S.data.prix,transport:S.data.transport,soc:S.data.soc};
   await FB.db.doc(R+'/config/general').set({json:JSON.stringify(c),maj:Date.now(),par});FB.envoi++;}
  FB.dernier=Date.now();
 }catch(e){fbEtat('err',String(e.message||e));}
}
let _fbT=null;
function fbPlanifier(){if(FB.etat!=='ok')return;clearTimeout(_fbT);_fbT=setTimeout(()=>fbPousser(),900);}
const enLocal=()=>location.protocol==='file:';
async function fbTest(){
 try{
  if(FB.etat!=='ok'){toast('Connectez d’abord la synchronisation.');return;}
  const R=fbRacine();const id='test-'+Date.now();
  await FB.db.doc(R+'/tests/'+id).set({quand:Date.now(),par:S.user?S.user.name:'',message:'essai de connexion'});
  const d=await FB.db.doc(R+'/tests/'+id).get();
  if(d.exists){toast('Aller-retour réussi : écriture et lecture confirmées dans '+R+'.');
   try{await FB.db.doc(R+'/tests/'+id).delete();}catch(e){}}
  else toast('Écriture acceptée mais relecture vide : vérifiez les règles.');
 }catch(e){const m=fbMsg(e&&(e.message||e.code)||e);fbEtat('err',m);toast('Échec du test : '+m);}
}

}
function brancherCloud(){
 if($('#fbCopy'))$('#fbCopy').onclick=()=>{const t=$('#fbRules');t.select();try{document.execCommand('copy');toast('Règles copiées : collez-les dans la console Firebase.');}catch(e){toast('Copie impossible.');}};
 if($('#fbGo'))$('#fbGo').onclick=()=>{const cfg=fbLire($('#fbTxt').value);
  if(!cfg){toast('Configuration non reconnue : collez le bloc firebaseConfig de votre projet.');return;}
  try{localStorage.removeItem('pcc.fbOff');}catch(e){}
  fbConnecter(cfg);};
 if($('#fbTest'))$('#fbTest').onclick=()=>fbTest();
 if($('#fbSend'))$('#fbSend').onclick=async()=>{orders().forEach(o=>{o.__envoye=0;});(S.data.chat||[]).forEach(m=>{m.__envoye=0;});await fbPousser();toast('Envoi terminé.');};
 if($('#fbStop'))$('#fbStop').onclick=()=>{try{localStorage.setItem('pcc.fbOff','1');}catch(e){}fbCouper();toast('Synchronisation coupée sur cet appareil.');};
 if($('#fbDel'))$('#fbDel').onclick=()=>{fbCouper();fbSet(null);render();toast('Configuration oubliée.');};
}
let _fbRetry=null,_fbEssais=0;
function fbAuto(){
 if(localStorage.getItem('pcc.fbOff')==='1')return;
 const c=fbCfg();if(!c)return;
 if(FB.etat==='off'||FB.etat==='err')fbConnecter(c);
 if(!_fbRetry){
  _fbRetry=setInterval(()=>{
   if(localStorage.getItem('pcc.fbOff')==='1')return;
   if(FB.etat==='err'&&navigator.onLine!==false){_fbEssais++;if(_fbEssais<60)fbConnecter(fbCfg());}
   else if(FB.etat==='ok'){_fbEssais=0;fbPousser();}
  },20000);
  window.addEventListener('online',()=>{if(FB.etat!=='ok'&&localStorage.getItem('pcc.fbOff')!=='1')fbConnecter(fbCfg());});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&FB.etat==='ok')fbPousser();});
 }
}
